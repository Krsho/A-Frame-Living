<!doctype html>
<!--
  Swagger UI – the visual API documentation.
  It loads the OpenAPI document from GET /openapi.json (generated from the
  #[OA\...] attributes in backend/routes/ and backend/docs/OpenApiDefinitions.php).
  Swagger UI itself is loaded from a CDN, so nothing has to be installed.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A-Frame Living API – Swagger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    body { margin: 0; background: #fff; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    // "../openapi.json" is relative to this page (backend/docs/), so it also works
    // when the backend runs in a subfolder, e.g. http://localhost/A-Frame-Living/backend/docs/
    window.ui = SwaggerUIBundle({
      url: new URL('../openapi.json', window.location.href).href,
      dom_id: '#swagger-ui',
      deepLinking: true,
    });
  </script>
</body>
</html>
